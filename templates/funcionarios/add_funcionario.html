<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Funcionário - AMC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../static/add_funcionario.css">
</head>
<body>
    <div class="main-content-wrapper">
        <div class="form-card">
            
            <header class="top-bar">
                <div class="logo-top">AMC</div>
                <h1 class="top-title">Adicionar Funcionário</h1>
                <div class="user-icon-top">
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <form action="#" method="POST">
                
                <div class="input-grid">
                    
                    <div class="input-group">
                        <label for="primeiro_nome">informe se primeiro nome:</label>
                        <input type="text" id="primeiro_nome" name="primeiro_nome" required>
                    </div>

                    <div class="input-group">
                        <label for="ultimo_nome">Informe seu segundo nome:</label>
                        <input type="text" id="ultimo_nome" name="ultimo_nome" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" name="idade" required>
                    </div>                    
                    
                    <div class="input-group">
                        <label for="CPF">CPF:</label>
                        <input type="number" id="CPF" name="CPF" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="cargo">Cargo:</label>
                        <input type="text" id="cargo" name="cargo" required>
                    </div>
                    <div class="input-group">
                        <label for="salario">Informe seu salário:</label>
                        <input type="text" id="salario" name="salario" required>
                    </div>
                    
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Cadastrar</button>
                    <button type="button" class="btn-secondary" href='/listar_funcionarios'>Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
